<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Educando Online é um portal de aprendizagem para quem deseja estudar tecnologia de forma prática.">

        <title>WebEduca — Portal de Aprendizagem</title>

       
<link rel="stylesheet" href="style.css">

<script src="documento.js" defer></script>

    </head>

    <body>
        <header>
            <h1>Web Educa</h1>
            <p>Aprenda tecnologia de forma prática.</p>
        </header>

        
<main>
    <!-- Área de pesquisa -->
    <section aria-labelledby="pesquisa-titulo">
        <h2 id="pesquisa-titulo">Pesquisar cursos</h2>

        <form id="form-pesquisa">
            <label for="curso">Nome do curso</label>

            <input
                id="curso"
                name="curso"
                type="search"
                placeholder="Ex.: HTML e CSS"
            >

            <button type="submit">Pesquisar</button>
        </form>

        <p id="resultado" aria-live="polite"></p>
    </section>

    <!-- Cursos disponíveis -->
    <section class="cursos">
        <h2>Tecnologias disponíveis</h2>

        <div class="lista-cursos">

            <div class="cartao">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg"
                    alt="Logo HTML">
                <h3>HTML</h3>
                <p>Estrutura de páginas web.</p>
            </div>

            <div class="cartao">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg"
                    alt="Logo CSS">
                <h3>CSS</h3>
                <p>Estilização de páginas web.</p>
            </div>

            <div class="cartao">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg"
                    alt="Logo JavaScript">
                <h3>JavaScript</h3>
                <p>Interatividade em páginas web.</p>
            </div>

        </div>
    </section>
</main>

        <footer>
            <p>WebEduca — Projeto educacional.</p>
        </footer>
    </body>
</html>
